<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}L'Almanach du Ciel — météo des villes de Tunisie{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}">
</head>
<body style="--accent: {{ accent | default('#B4552D') }}">

  <header class="masthead">
    <a class="masthead__title misprint" href="/">L'Almanach du Ciel</a>
    <span class="masthead__sub">météo imprimée des villes de Tunisie</span>
  </header>

  <main class="sheet">
    {% block content %}{% endblock %}
  </main>

  <footer class="colophon">
    <nav class="colophon__links">
      <a href="/choisir-ville">Changer de ville</a>
      <a href="/credits">Crédits photos</a>
    </nav>
    <p class="colophon__src">Données&nbsp;: Open-Meteo · Photos&nbsp;: Wikimedia Commons (licences libres)</p>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
