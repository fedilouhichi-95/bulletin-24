<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ brand.name }} {{ brand.tagline }}{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}{{ brand.tagline }} — températures et prévisions en direct.{% endblock %}">
  <meta name="theme-color" content="#E8E0C0">
  <meta property="og:title" content="{% block og_title %}{{ brand.name }} — {{ brand.tagline }}{% endblock %}">
  <meta property="og:description" content="{% block og_description %}{{ self.meta_description() }}{% endblock %}">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23E8E0C0'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23B4552D'/%3E%3Cg stroke='%23211D16' stroke-width='2'%3E%3Cpath d='M16 2v5M16 25v5M2 16h5M25 16h5M6 6l3.5 3.5M22.5 22.5L26 26M26 6l-3.5 3.5M9.5 22.5L6 26'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}">
</head>
<body style="--accent: {{ accent | default('#B4552D') }}">

  <header class="masthead">
    <div class="masthead__top">
      <details class="menu">
        <summary class="menu__btn" aria-label="Ouvrir le menu">
          <svg width="14" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="3" r="1.7"/><circle cx="8" cy="8" r="1.7"/><circle cx="8" cy="13" r="1.7"/>
          </svg>
        </summary>
    <nav class="menu__panel" aria-label="Menu principal">
      <a href="/choisir-ville">Changer de ville</a>
      <button type="button" data-geoloc>Ma position</button>
    </nav>
      </details>
      <p class="masthead__dateline"><span>{{ edition_fr }}</span></p>
    </div>
    <a class="masthead__title misprint" href="/choisir-ville">{{ brand.name }}</a>
    <p class="masthead__sub">{{ brand.tagline }}</p>
  </header>

  <main class="sheet">
    {% block content %}{% endblock %}
  </main>

  <footer class="colophon">
    <p class="colophon__legal">© {{ year }} Fedi Louhichi — Tous droits réservés.</p>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
